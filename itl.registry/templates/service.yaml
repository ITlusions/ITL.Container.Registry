apiVersion: v1
kind: Service
metadata:
  name: registry
  namespace: {{ .Values.namespace }}
spec:
  selector:
    app: registry
  type: {{ if .Values.service.nodePort }}NodePort{{ else }}ClusterIP{{ end }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: 5000
      {{- if .Values.service.nodePort }}
      nodePort: {{ .Values.service.nodePort }}
      {{- end }}
