{{- if and .Values.auth.enabled .Values.auth.bootstrapJob.enabled }}
# Runs once, on the first `helm install` only (helm.sh/hook: post-install,
# not post-upgrade) - generates a random password + its bcrypt hash and
# creates the Secret the Deployment expects, if it doesn't already exist.
# A later `helm upgrade` never touches this again, so it won't clobber a
# password you've since rotated by hand.
#
# The generated password only ever exists in plaintext in this Job's own
# pod logs, once - `kubectl logs -n {{ .Values.namespace }} job/itl-registry-bootstrap-secret`
# right after install, before the pod/logs get cleaned up. Same pattern
# several real charts (Harbor, GitLab) use for their initial admin
# credential - not retrievable after the fact, by design.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: itl-registry-bootstrap
  namespace: {{ .Values.namespace }}
  annotations:
    helm.sh/hook: post-install
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
---
# Scoped to exactly get+create on Secrets in this one namespace - nothing
# broader. create can't be resourceName-restricted (the object doesn't
# exist yet on first run), but get is, so this role can never be used to
# read any OTHER secret in the namespace, only to check for/create this one.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: itl-registry-bootstrap
  namespace: {{ .Values.namespace }}
  annotations:
    helm.sh/hook: post-install
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: [{{ .Values.auth.secretName | quote }}]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: itl-registry-bootstrap
  namespace: {{ .Values.namespace }}
  annotations:
    helm.sh/hook: post-install
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: itl-registry-bootstrap
subjects:
  - kind: ServiceAccount
    name: itl-registry-bootstrap
    namespace: {{ .Values.namespace }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: itl-registry-bootstrap-script
  namespace: {{ .Values.namespace }}
  annotations:
    helm.sh/hook: post-install
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
data:
  create_secret.py: |
    import os
    import subprocess
    import sys

    secret_name = os.environ["SECRET_NAME"]
    namespace = os.environ["NAMESPACE"]
    username = os.environ["BOOTSTRAP_USERNAME"]

    check = subprocess.run(
        ["kubectl", "get", "secret", secret_name, "-n", namespace],
        capture_output=True,
    )
    if check.returncode == 0:
        print(f"{secret_name} already exists in {namespace} - leaving it alone")
        sys.exit(0)

    subprocess.run(
        [
            "kubectl", "create", "secret", "generic", secret_name,
            "-n", namespace,
            "--from-file=htpasswd=/shared/htpasswd",
        ],
        check=True,
    )

    with open("/shared/password", encoding="utf-8") as f:
        password = f.read().strip()

    print("=" * 50)
    print(f"Generated registry credentials for {namespace}:")
    print(f"  username: {username}")
    print(f"  password: {password}")
    print()
    print("SAVE THIS NOW. It is only ever shown here, in this")
    print("Job's pod log, once. It cannot be recovered after.")
    print("=" * 50)
---
apiVersion: batch/v1
kind: Job
metadata:
  name: itl-registry-bootstrap-secret
  namespace: {{ .Values.namespace }}
  annotations:
    helm.sh/hook: post-install
    helm.sh/hook-weight: "0"
    # Deliberately NOT hook-succeeded here, unlike the RBAC/ConfigMap above -
    # confirmed live: that policy deletes the Job (and its pod/logs) within
    # moments of success, before there's any real chance to run `kubectl
    # logs` and actually capture the generated password. before-hook-creation
    # alone still cleans up a stale Job from a previous failed/retried
    # install before a new one starts, but leaves a successful one sitting
    # in Completed state - the whole point of printing the password here.
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: 1
  template:
    spec:
      serviceAccountName: itl-registry-bootstrap
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        # httpd:2.4-alpine's default user is root (82/www-data exists but
        # isn't the default) - fsGroup makes the shared emptyDir writable
        # by whatever non-root UID each container explicitly runs as below.
        fsGroup: 82
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # httpd:2.4-alpine - the same image already used by hand this
        # session to generate htpasswd entries - has the htpasswd binary.
        # Its own default user is root, so runAsNonRoot (set above) needs
        # an explicit override here: www-data, confirmed uid=82 gid=82 in
        # this image's own /etc/passwd.
        - name: generate-hash
          image: "httpd@sha256:070da7661f0be8a05430b2c125c0cde9e53176b4048c813024021969a0e3893c"
          securityContext:
            runAsUser: 82
            runAsGroup: 82
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              PASS=$(head -c 24 /dev/urandom | base64 | tr -d '/+=\n' | cut -c1-24)
              printf '%s' "$PASS" > /shared/password
              htpasswd -nbB {{ .Values.auth.bootstrapUsername | quote }} "$PASS" > /shared/htpasswd
          volumeMounts:
            - name: shared
              mountPath: /shared
      containers:
        - name: create-secret
          # v1.37.1 - matching this cluster's own server version exactly
          # (kubectl version --client vs --server), not just any kubectl.
          image: "alpine/k8s@sha256:712dc5385d1c1a3f83b747fa9e40f64d433a97f72ff42f9755ff7dd1f62846e4"
          securityContext:
            # alpine/k8s's default user is root too (confirmed) - nobody
            # (65534) exists in this image, used the same way as www-data
            # above for generate-hash.
            runAsUser: 65534
            runAsGroup: 65534
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          command: ["python3", "/scripts/create_secret.py"]
          env:
            - name: SECRET_NAME
              value: {{ .Values.auth.secretName | quote }}
            - name: NAMESPACE
              value: {{ .Values.namespace | quote }}
            - name: BOOTSTRAP_USERNAME
              value: {{ .Values.auth.bootstrapUsername | quote }}
          volumeMounts:
            - name: shared
              mountPath: /shared
              readOnly: true
            - name: script
              mountPath: /scripts
              readOnly: true
      volumes:
        - name: shared
          emptyDir: {}
        - name: script
          configMap:
            name: itl-registry-bootstrap-script
{{- end }}
